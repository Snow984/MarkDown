version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: markdown-editor-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: markdown_editor
      MYSQL_USER: markdown
      MYSQL_PASSWORD: markdown123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - markdown-editor-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0
    container_name: markdown-editor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - markdown-editor-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: markdown-editor-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - markdown-editor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: markdown-editor-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - markdown-editor-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: markdown-editor-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/markdown_editor?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: markdown
      SPRING_DATASOURCE_PASSWORD: markdown123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      OLLAMA_BASE_URL: http://ollama:11434
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - markdown-editor-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: markdown-editor-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - markdown-editor-network

volumes:
  mysql-data:
  redis-data:
  minio-data:
  ollama-data:

networks:
  markdown-editor-network:
    driver: bridge
