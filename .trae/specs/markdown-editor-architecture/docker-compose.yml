version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: markdown-editor-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: markdown_editor
      MYSQL_USER: editor
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - markdown-editor-network
    restart: always

  redis:
    image: redis:7.0
    container_name: markdown-editor-redis
    ports:
      - "6379:6379"
    networks:
      - markdown-editor-network
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: markdown-editor-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - markdown-editor-network
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: markdown-editor-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - markdown-editor-network
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: markdown-editor-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - markdown-editor-network
    restart: always
    command: serve

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: markdown-editor-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/markdown_editor
      SPRING_DATASOURCE_USERNAME: editor
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OLLAMA_API_URL: http://ollama:11434
    depends_on:
      - mysql
      - redis
      - kafka
      - ollama
    networks:
      - markdown-editor-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: markdown-editor-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8080/api
    networks:
      - markdown-editor-network
    restart: always

networks:
  markdown-editor-network:
    driver: bridge

volumes:
  mysql_data:
  ollama_data: